<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Voice To English</title>

  <meta
    name="description"
    content="Speak in Urdu, Roman Urdu or Hindi and convert your speech into professional English."
  >

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(212, 175, 55, 0.14), transparent 35%),
        radial-gradient(circle at bottom right, rgba(0, 110, 255, 0.12), transparent 35%),
        #07111f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 25px;
    }

    .container {
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: rgba(12, 25, 42, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      width: 70px;
      height: 70px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      background: linear-gradient(135deg, #d4af37, #f5d778);
      color: #07111f;
      box-shadow: 0 10px 35px rgba(212, 175, 55, 0.25);
    }

    h1 {
      font-size: 38px;
      margin-bottom: 10px;
      background: linear-gradient(90deg, #ffffff, #d4af37);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      color: #aeb9c8;
      font-size: 16px;
      line-height: 1.6;
    }

    .language-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .language-box {
      background: rgba(255, 255, 255, 0.045);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 15px;
    }

    .language-label {
      color: #8997aa;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 7px;
    }

    .language-value {
      color: #ffffff;
      font-weight: 600;
    }

    .section {
      margin-top: 20px;
    }

    .section-title {
      color: #d4af37;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      resize: vertical;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: #081522;
      color: #ffffff;
      padding: 18px;
      font-size: 17px;
      line-height: 1.6;
      outline: none;
    }

    textarea:focus {
      border-color: rgba(212, 175, 55, 0.65);
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08);
    }

    textarea::placeholder {
      color: #637286;
    }

    .voice-area {
      text-align: center;
      margin: 25px 0;
    }

    .mic-button {
      width: 90px;
      height: 90px;
      border: none;
      border-radius: 50%;
      background: linear-gradient(135deg, #d4af37, #f3d46d);
      color: #07111f;
      font-size: 35px;
      cursor: pointer;
      box-shadow: 0 12px 35px rgba(212, 175, 55, 0.25);
      transition: 0.2s ease;
    }

    .mic-button:hover {
      transform: translateY(-2px) scale(1.03);
    }

    .mic-button:active {
      transform: scale(0.97);
    }

    .mic-button.recording {
      animation: pulse 1.2s infinite;
      background: #e05252;
      color: #ffffff;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(224, 82, 82, 0.5);
      }

      70% {
        box-shadow: 0 0 0 25px rgba(224, 82, 82, 0);
      }

      100% {
        box-shadow: 0 0 0 0 rgba(224, 82, 82, 0);
      }
    }

    .mic-text {
      margin-top: 12px;
      color: #aeb9c8;
      font-size: 14px;
    }

    .status {
      min-height: 24px;
      text-align: center;
      margin: 10px 0;
      color: #d4af37;
      font-size: 14px;
    }

    .status.error {
      color: #ff7777;
    }

    .status.success {
      color: #67d89a;
    }

    .button-row {
      display: flex;
      gap: 12px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    button.action {
      flex: 1;
      min-width: 130px;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.10);
      background: rgba(255, 255, 255, 0.06);
      color: #ffffff;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s ease;
    }

    button.action:hover {
      background: rgba(255, 255, 255, 0.11);
    }

    button.primary {
      background: linear-gradient(135deg, #d4af37, #f3d46d);
      color: #07111f;
      border: none;
    }

    button.primary:hover {
      opacity: 0.92;
    }

    .footer {
      text-align: center;
      color: #637286;
      font-size: 12px;
      margin-top: 25px;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 22px;
        border-radius: 18px;
      }

      h1 {
        font-size: 30px;
      }

      .language-row {
        grid-template-columns: 1fr;
      }

      textarea {
        min-height: 130px;
      }

      .mic-button {
        width: 80px;
        height: 80px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="card">

      <div class="header">
        <div class="logo">🎤</div>

        <h1>Voice To English</h1>

        <p class="subtitle">
          Speak naturally in Urdu, Roman Urdu or Hindi
          and convert your speech into professional English.
        </p>
      </div>


      <div class="language-row">

        <div class="language-box">
          <div class="language-label">Input Language</div>
          <div class="language-value">
            Urdu / Roman Urdu / Hindi
          </div>
        </div>

        <div class="language-box">
          <div class="language-label">Output</div>
          <div class="language-value">
            Professional English
          </div>
        </div>

      </div>


      <div class="section">

        <div class="section-title">
          Your Speech / Text
        </div>

        <textarea
          id="inputText"
          placeholder="Press the microphone and speak here..."
        ></textarea>

      </div>


      <div class="voice-area">

        <button
          id="micButton"
          class="mic-button"
          type="button"
          title="Start speaking"
        >
          🎤
        </button>

        <div
          id="micText"
          class="mic-text"
        >
          Click microphone and start speaking
        </div>

      </div>


      <div
        id="status"
        class="status"
      ></div>


      <div class="button-row">

        <button
          id="translateButton"
          class="action primary"
          type="button"
        >
          Translate to English
        </button>

        <button
          id="copyButton"
          class="action"
          type="button"
        >
          Copy
        </button>

        <button
          id="listenButton"
          class="action"
          type="button"
        >
          🔊 Listen
        </button>

        <button
          id="clearButton"
          class="action"
          type="button"
        >
          Clear
        </button>

      </div>


      <div class="section">

        <div class="section-title">
          Professional English
        </div>

        <textarea
          id="outputText"
          placeholder="Your professional English translation will appear here..."
          readonly
        ></textarea>

      </div>


      <div class="footer">
        Voice To English
      </div>

    </div>

  </div>


  <script>

    /*
     * Google Apps Script Web App
     * Your URL is already connected here.
     */
    const API_URL =
      "https://script.google.com/macros/s/AKfycbz3B_vJ9IinNwwhb4CYisaZ4uU0ROhttILvNSuDPvAhNJcndgEdFCV1brRC222L5bA-/exec";


    const inputText =
      document.getElementById("inputText");

    const outputText =
      document.getElementById("outputText");

    const micButton =
      document.getElementById("micButton");

    const micText =
      document.getElementById("micText");

    const statusBox =
      document.getElementById("status");

    const translateButton =
      document.getElementById("translateButton");

    const copyButton =
      document.getElementById("copyButton");

    const listenButton =
      document.getElementById("listenButton");

    const clearButton =
      document.getElementById("clearButton");


    /*
     * Speech Recognition
     */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    let recognition = null;
    let isRecording = false;


    if (SpeechRecognition) {

      recognition = new SpeechRecognition();

      recognition.lang = "ur-PK";

      recognition.continuous = true;

      recognition.interimResults = true;


      recognition.onstart = function() {

        isRecording = true;

        micButton.classList.add("recording");

        micButton.textContent = "⏹";

        micText.textContent =
          "Listening... Speak now";

        setStatus(
          "Listening...",
          ""
        );
      };


      recognition.onresult = function(event) {

        let finalText = "";

        let interimText = "";

        for (
          let i = event.resultIndex;
          i < event.results.length;
          i++
        ) {

          const transcript =
            event.results[i][0].transcript;

          if (event.results[i].isFinal) {

            finalText += transcript + " ";

          } else {

            interimText += transcript;

          }

        }


        if (finalText.trim()) {

          inputText.value =
            (
              inputText.value +
              " " +
              finalText
            ).trim();

        }


        if (interimText) {

          micText.textContent =
            interimText;

        }

      };


      recognition.onerror = function(event) {

        console.error(
          "Speech recognition error:",
          event.error
        );

        if (event.error === "not-allowed") {

          setStatus(
            "Microphone permission was denied.",
            "error"
          );

        } else if (event.error === "no-speech") {

          setStatus(
            "No speech detected. Please try again.",
            "error"
          );

        } else {

          setStatus(
            "Microphone error: " + event.error,
            "error"
          );

        }

      };


      recognition.onend = function() {

        isRecording = false;

        micButton.classList.remove("recording");

        micButton.textContent = "🎤";

        micText.textContent =
          "Click microphone and start speaking";

      };

    } else {

      micButton.disabled = true;

      micButton.style.opacity = "0.5";

      micText.textContent =
        "Speech recognition is not supported in this browser.";

    }


    micButton.addEventListener(
      "click",
      function() {

        if (!recognition) {

          setStatus(
            "Please use Google Chrome for voice input.",
            "error"
          );

          return;

        }


        if (isRecording) {

          recognition.stop();

        } else {

          try {

            recognition.start();

          } catch (error) {

            console.error(error);

          }

        }

      }
    );


    /*
     * Translate
     */

    translateButton.addEventListener(
      "click",
      translateText
    );


    async function translateText() {

      const text =
        inputText.value.trim();


      if (!text) {

        setStatus(
          "Please speak or enter some text first.",
          "error"
        );

        return;

      }


      translateButton.disabled = true;

      translateButton.textContent =
        "Translating...";

      setStatus(
        "Please wait...",
        ""
      );


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({
                text: text
              })
            }
          );


        const result =
          await response.json();


        if (!result.success) {

          throw new Error(
            result.error ||
            "Translation failed."
          );

        }


        outputText.value =
          result.english || "";


        setStatus(
          "Translation completed.",
          "success"
        );


      } catch (error) {

        console.error(
          "Translation error:",
          error
        );


        setStatus(
          "Translation failed: " +
          error.message,
          "error"
        );

      } finally {

        translateButton.disabled = false;

        translateButton.textContent =
          "Translate to English";

      }

    }


    /*
     * Copy
     */

    copyButton.addEventListener(
      "click",
      async function() {

        const text =
          outputText.value.trim();


        if (!text) {

          setStatus(
            "There is no English text to copy.",
            "error"
          );

          return;

        }


        try {

          await navigator.clipboard.writeText(
            text
          );

          setStatus(
            "English text copied.",
            "success"
          );

        } catch (error) {

          outputText.select();

          document.execCommand("copy");

          setStatus(
            "English text copied.",
            "success"
          );

        }

      }
    );


    /*
     * Listen to English
     */

    listenButton.addEventListener(
      "click",
      function() {

        const text =
          outputText.value.trim();


        if (!text) {

          setStatus(
            "There is no English text to listen to.",
            "error"
          );

          return;

        }


        if (!("speechSynthesis" in window)) {

          setStatus(
            "Text-to-speech is not supported.",
            "error"
          );

          return;

        }


        window.speechSynthesis.cancel();


        const speech =
          new SpeechSynthesisUtterance(text);

        speech.lang = "en-US";

        speech.rate = 0.95;

        speech.pitch = 1;


        window.speechSynthesis.speak(
          speech
        );

      }
    );


    /*
     * Clear
     */

    clearButton.addEventListener(
      "click",
      function() {

        inputText.value = "";

        outputText.value = "";

        setStatus("", "");

        micText.textContent =
          "Click microphone and start speaking";

      }
    );


    /*
     * Status helper
     */

    function setStatus(
      message,
      type
    ) {

      statusBox.textContent =
        message;

      statusBox.className =
        "status";

      if (type) {

        statusBox.classList.add(type);

      }

    }

  </script>

</body>
</html>
